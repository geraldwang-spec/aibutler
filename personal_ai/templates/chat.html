{% extends 'live_base.html' %}{% block content %}<div class="chat-workspace">
<section class="panel-card"><h2>AI 對話</h2><form method="post" action="{{url_for('personal_ai.chat_new')}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><input name="title" maxlength="120" placeholder="新對話主題" required><button>建立對話</button></form><nav>{% for c in chats %}<a href="{{url_for('personal_ai.chat_page',chat_id=c.id)}}">{{c.title}}</a> · {% endfor %}</nav></section>
{% if chat %}<section class="panel-card"><h2>{{chat.title}}</h2>{% for m in messages %}<article class="chat-message {{'chat-user' if m.role=='user' else 'chat-assistant'}}"><strong>{{'你' if m.role=='user' else 'AI'}}</strong><p class="prewrap">{{m.content}}</p></article>{% endfor %}<form method="post" class="chat-composer"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>教材範圍<select name="subject_id"><option value="">一般對話</option>{% for s in subjects %}<option value="{{s.id}}">{{s.subject_name}}</option>{% endfor %}</select></label><textarea name="question" required maxlength="1500" placeholder="輸入問題"></textarea><button>送出</button></form></section>{% endif %}
</div>{% endblock %}
