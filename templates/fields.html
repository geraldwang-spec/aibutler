{% macro render_fields(fields, values, choices) %}<div class="form-grid">{% for field in fields %}<label for="{{ field.name }}">{{ field.label }}{% if not field.required %}（選填）{% endif %}
{% if field.kind in ['ref','select'] %}<select id="{{ field.name }}" name="{{ field.name }}" {% if field.required %}required{% endif %}><option value="">請選擇</option>{% if field.kind=='ref' %}{% for value,label in choices.get(field.name,[]) %}<option value="{{ value }}" {% if values.get(field.name,'')|string==value|string %}selected{% endif %}>{{ label }}</option>{% endfor %}{% else %}{% for value in field.choices %}<option value="{{ value }}" {% if values.get(field.name,'')|string==value|string %}selected{% endif %}>{{ value }}</option>{% endfor %}{% endif %}</select>
{% elif field.kind=='textarea' %}<textarea id="{{ field.name }}" name="{{ field.name }}" maxlength="{{ field.limit }}" {% if field.required %}required{% endif %}>{{ values.get(field.name,'') or '' }}</textarea>
{% else %}<input id="{{ field.name }}" name="{{ field.name }}" type="{{ 'number' if field.kind in ['number','decimal'] else field.kind }}" {% if field.required %}required{% endif %} value="{{ values.get(field.name,'') if values.get(field.name) is not none else '' }}" {% if field.kind in ['number','decimal'] %}min="{{ field.minimum }}" max="{{ field.maximum }}" step="{{ '0.01' if field.kind=='decimal' else '1' }}"{% else %}maxlength="{{ field.limit }}"{% endif %}>{% endif %}</label>{% endfor %}</div>{% endmacro %}
