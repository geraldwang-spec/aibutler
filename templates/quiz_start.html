{% extends 'live_base.html' %}{% block content %}<section class="panel-card"><h2>從自己的題庫開始練習</h2><p>只抽取所選科目的既有題目；不使用 AI 出題。題目不足時以實際題數開始。</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid"><label>科目<select name="subject_id" required><option value="">請選擇</option>{% for id,name in subjects %}<option value="{{ id }}">{{ name }}</option>{% endfor %}</select></label><label>模式<select name="mode"><option>練習</option><option>模擬考</option><option>錯題複習</option></select></label><label>題數<input type="number" name="count" value="10" min="1" max="100" required></label></div><button class="action">開始作答</button></form></section><section class="panel-card"><h2>測驗紀錄</h2>{% for row in sessions %}<div class="record-item"><a href="{{ url_for('quiz_take',sid=row.id) }}">#{{ row.id }} · {{ row.mode }} · {{ row.total_count }} 題 · {{ '查看成績' if row.finished_at else '繼續作答' }}</a></div>{% else %}<p>尚無測驗。</p>{% endfor %}</section>{% endblock %}
